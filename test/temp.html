<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StackedCards Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: auto; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
    }
    /* Kill default scroll-behavior so GSAP can take over */
    html { scroll-behavior: auto !important; }
  </style>
</head>
<body>

<!-- Hero intro section -->
<section id="hero" style="height:100vh; display:flex; align-items:center; justify-content:center; background:#0a0a0a; flex-direction:column; gap:0;">
  <p style="color:#555; font-size:0.7rem; letter-spacing:0.25em; text-transform:uppercase; margin-bottom:1rem;">Scroll to explore</p>
  <h1 style="font-size:clamp(2.5rem,6vw,5rem); font-weight:800; letter-spacing:-0.04em; color:#fff;">BanG Dream!</h1>
  <p style="color:#666; margin-top:1rem; font-size:0.95rem; max-width:360px; text-align:center; line-height:1.7;">
    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Discover the bands that define the sound.
  </p>
  <div style="margin-top:2.5rem; display:flex; flex-direction:column; align-items:center; gap:6px; color:#444;">
    <span style="font-size:0.65rem; letter-spacing:0.2em; text-transform:uppercase;">Scroll</span>
    <svg id="scroll-arrow" width="16" height="22" viewBox="0 0 16 22" fill="none">
      <path d="M8 2v18M2 14l6 6 6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</section>

<!-- Cards container -->
<div id="cards-container" style="position:relative; width:100%;">
</div>

<!-- Footer -->
<section style="height:100vh; background:#0a0a0a; display:flex; align-items:center; justify-content:center;">
  <p style="color:#333; font-size:0.7rem; letter-spacing:0.25em; text-transform:uppercase;">End of lineup</p>
</section>

<script>
gsap.registerPlugin(ScrollTrigger);

const PEEK_HEIGHT = 52;

const cards = [
  {
    id: 1,
    band: "01",
    title: "夢限大みゅーたいぷ",
    subtitle: "Mugen Dai Myuu-type",
    members: ["Vo.", "Gt.", "Gt.", "Ba.", "Dr."],
    description: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation.",
    bg: "#d94f8a",
    accent: "#ff9fd0",
    dark: false,
  },
  {
    id: 2,
    band: "02",
    title: "Ave Mujica",
    subtitle: "アヴェムジカ",
    members: ["Gt.&Vo.", "Gt.", "Ba.", "Dr.", "Key."],
    description: "Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident.",
    bg: "#6b1440",
    accent: "#e8a0c8",
    dark: true,
  },
  {
    id: 3,
    band: "03",
    title: "MyGO!!!!!",
    subtitle: "マイゴ",
    members: ["Vo.", "Gt.", "Gt.", "Ba.", "Dr."],
    description: "Pellentesque habitant morbi tristique senectus et netus et malesuada fames ac turpis egestas. Vestibulum tortor quam, feugiat vitae, ultricies eget.",
    bg: "#1b5e96",
    accent: "#7ec8f5",
    dark: true,
  },
  {
    id: 4,
    band: "04",
    title: "DOLLCHESTRA",
    subtitle: "ドルケストラ",
    members: ["Vo.", "Gt.", "Ba.", "Dr.", "Key."],
    description: "Aenean ultricies mi vitae est. Mauris placerat eleifend leo. Quisque sit amet est et sapien ullamcorper pharetra. Vestibulum erat wisi, condimentum sed.",
    bg: "#12122a",
    accent: "#f0d060",
    dark: true,
  },
  {
    id: 5,
    band: "05",
    title: "Morfonica",
    subtitle: "モルフォニカ",
    members: ["Vo.", "Gt.", "Ba.", "Dr.", "Vn."],
    description: "Nam pretium turpis et arcu. Duis arcu tortor, suscipit eget, imperdiet nec, imperdiet iaculis, ipsum. Sed aliquam ultrices mauris. Integer ante arcu.",
    bg: "#2a1260",
    accent: "#c4a0ff",
    dark: true,
  },
];

const container = document.getElementById('cards-container');

// Build cards
cards.forEach((card, i) => {
  const wrapper = document.createElement('div');
  wrapper.className = 'card-wrapper';
  wrapper.id = `card-${i}`;
  wrapper.style.cssText = `
    position: relative;
    width: 100%;
    margin-top: ${i === 0 ? '0' : `-${PEEK_HEIGHT}px`};
    z-index: ${i + 1};
    will-change: transform;
  `;

  const textColor = '#fff';
  const mutedColor = 'rgba(255,255,255,0.55)';
  const borderColor = 'rgba(255,255,255,0.1)';

  wrapper.innerHTML = `
    <div class="card-inner" style="
      position: relative;
      width: 100%;
      height: calc(100vh - ${PEEK_HEIGHT}px);
      background-color: ${card.bg};
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -12px 48px rgba(0,0,0,0.5);
      display: flex;
      overflow: hidden;
    ">

      <!-- Left info panel -->
      <div style="
        width: 320px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 2.5rem;
        border-right: 1px solid ${borderColor};
      ">
        <div>
          <span style="
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: ${textColor};
            background: rgba(255,255,255,0.12);
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 1.5rem;
          ">Band ${card.band}</span>

          <h2 style="
            font-size: clamp(1.6rem, 2.5vw, 2.2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            color: ${textColor};
            margin-bottom: 0.5rem;
          ">${card.title}</h2>

          <p style="
            font-size: 1rem;
            font-weight: 300;
            color: ${mutedColor};
            margin-bottom: 0;
          ">${card.subtitle}</p>
        </div>

        <div>
          <p style="
            font-size: 0.8rem;
            line-height: 1.75;
            color: ${mutedColor};
            margin-bottom: 1.75rem;
            max-width: 36ch;
          ">${card.description}</p>

          <!-- Members -->
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:1.75rem;">
            ${card.members.map(m => `
              <span style="
                font-size: 0.65rem;
                font-weight: 500;
                letter-spacing: 0.08em;
                color: ${textColor};
                background: rgba(255,255,255,0.1);
                border: 1px solid rgba(255,255,255,0.18);
                padding: 3px 10px;
                border-radius: 999px;
              ">${m}</span>
            `).join('')}
          </div>

          <button style="
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            color: ${textColor};
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 9px 20px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s;
          "
          onmouseover="this.style.background='rgba(255,255,255,0.25)'"
          onmouseout="this.style.background='rgba(255,255,255,0.15)'"
          >
            Learn more
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>

      <!-- Right visual panel -->
      <div style="flex:1; position:relative; overflow:hidden;">

        <!-- Gradient blob -->
        <div style="
          position: absolute; inset: 0;
          background: radial-gradient(ellipse 65% 55% at 55% 50%, ${card.accent}44, transparent);
          pointer-events: none;
        "></div>

        <!-- Large number watermark -->
        <div style="
          position: absolute;
          right: -0.5rem;
          top: 50%;
          transform: translateY(-50%);
          font-size: clamp(10rem, 18vw, 20rem);
          font-weight: 900;
          letter-spacing: -0.08em;
          line-height: 1;
          color: ${card.accent};
          opacity: 0.07;
          user-select: none;
          pointer-events: none;
        ">${card.band}</div>

        <!-- Subtitle watermark -->
        <div style="
          position: absolute;
          left: 2rem; bottom: 2.5rem;
          font-size: clamp(1.5rem, 3vw, 2.5rem);
          font-weight: 700;
          letter-spacing: 0.04em;
          color: ${card.accent};
          opacity: 0.2;
          user-select: none;
        ">${card.subtitle}</div>

        <!-- Top-right meta -->
        <div style="
          position: absolute;
          top: 2rem; right: 2rem;
          font-size: 0.65rem;
          font-family: monospace;
          letter-spacing: 0.1em;
          color: rgba(255,255,255,0.25);
          text-transform: uppercase;
        ">BanG Dream! — ${card.title}</div>

        <!-- Accent line bottom -->
        <div style="
          position: absolute;
          bottom: 0; left: 0; right: 0;
          height: 3px;
          background: linear-gradient(to right, ${card.accent}00, ${card.accent}88, ${card.accent}00);
        "></div>

        <!-- Decorative circle -->
        <div style="
          position: absolute;
          top: 2rem; left: 2rem;
          width: 80px; height: 80px;
          border-radius: 50%;
          border: 1px solid ${card.accent}33;
        "></div>
        <div style="
          position: absolute;
          top: 2.75rem; left: 2.75rem;
          width: 30px; height: 30px;
          border-radius: 50%;
          background: ${card.accent}22;
          border: 1px solid ${card.accent}55;
        "></div>
      </div>

      <!-- Bottom peek label (shows when card is partially visible) -->
      <div style="
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: ${PEEK_HEIGHT}px;
        display: flex;
        align-items: center;
        padding: 0 2.5rem;
        background: ${card.bg};
        border-top: 1px solid rgba(255,255,255,0.06);
      ">
        <span style="font-size:0.65rem; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,255,255,0.3);">
          ${card.title} · ${card.subtitle}
        </span>
      </div>

    </div>
  `;

  container.appendChild(wrapper);
});

// GSAP ScrollTrigger pinning + scale
const wrappers = document.querySelectorAll('.card-wrapper');

wrappers.forEach((wrapper, i) => {
  if (i >= cards.length - 1) return; // last card doesn't shrink

  const scaleEnd = 0.9 - i * 0.015;

  ScrollTrigger.create({
    trigger: wrapper,
    start: 'top top',
    end: 'bottom top',
    pin: true,
    pinSpacing: false,
    scrub: 0.4,
    onUpdate(self) {
      const p = self.progress;
      const scale = 1 - (1 - scaleEnd) * p;
      const yPull = -p * 10 * (i + 1);
      gsap.set(wrapper, {
        scale,
        y: yPull,
        transformOrigin: 'top center',
      });
    },
  });
});

// Animate scroll arrow
gsap.to('#scroll-arrow', {
  y: 6,
  repeat: -1,
  yoyo: true,
  duration: 0.9,
  ease: 'power1.inOut',
});
</script>

</body>
</html>
